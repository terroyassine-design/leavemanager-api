spring.application.name=leavemanager-api
server.port=${PORT:8080}
# Behind the hosting proxy, trust X-Forwarded-For only from internal proxies (real client IP for rate limiting)
server.forward-headers-strategy=native

# Database (defaults match docker-compose.yml for local development)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/leavemanager}
spring.datasource.username=${DATABASE_USERNAME:leavemanager}
spring.datasource.password=${DATABASE_PASSWORD:leavemanager}

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Security - JWT_SECRET is mandatory in production (profile "prod"): the app refuses to start
# with this public development default (see JwtSecretPolicy)
app.jwt.secret=${JWT_SECRET:local-dev-secret-not-for-production-1234567890}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Demo accounts for visitors (see DemoDataSeeder)
app.demo-data.enabled=${DEMO_DATA_ENABLED:true}

# Only expose the health check (used by the hosting platform)
management.endpoints.web.exposure.include=health
